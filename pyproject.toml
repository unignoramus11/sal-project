[project]
name = "sal"
version = "0.1.0"
description = "Order, duration, or melody? Probing what phone recognizers use to geolocate Haryanvi and Hindi-belt speech"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Mohit Kumar Singh" },
    { name = "Nidhi Vaidya" },
]
dependencies = [
    "torch>=2.6",
    "torchaudio>=2.6",
    "transformers>=4.46",
    "huggingface-hub>=0.35",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "soundfile>=0.12",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyyaml>=6",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "praat-parselmouth>=0.4.5",
    "onnxruntime>=1.19",
    "kaldi-native-fbank>=1.20",
    "panphon>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
